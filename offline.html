<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - Musalingo</title>
    <style>
        :root {
            --bg: #fdf2f8;
            --bg-secondary: #f4f8ff;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --accent: #EC96C7;
            --accent-dark: #F490C3;
            --accent-shadow: #C46AA1;
            --blue: #2b70c9;
            --warning: #f59e0b;
            --danger: #ef4444;
            --success: #22c55e;
            --border: #e5e7eb;
        }

        body.dark-mode {
            --bg: #111827;
            --bg-secondary: #1f2937;
            --card: #1f2937;
            --text: #e5e7eb;
            --muted: #aeb9ca;
            --border: #374151;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, var(--bg-secondary) 100%);
            color: var(--text);
            transition: background 0.3s ease, color 0.3s ease;
        }

        .card {
            width: min(460px, 100%);
            background: var(--card);
            border-radius: 24px;
            padding: 36px 28px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
            text-align: center;
            transition: background 0.3s ease;
        }

        body.dark-mode .card {
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid #374151;
        }

        .owl {
            font-size: 4.5rem;
            line-height: 1;
            margin-bottom: 16px;
            display: inline-block;
            animation: bob 3s ease-in-out infinite;
        }

        @keyframes bob {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }
        }

        h1 {
            margin: 0 0 10px;
            font-size: 1.5rem;
            color: var(--accent-dark);
            letter-spacing: -0.02em;
            font-weight: 800;
        }

        p {
            margin: 0 0 20px;
            color: var(--muted);
            line-height: 1.5;
            font-size: 0.98rem;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(239, 68, 68, 0.12);
            color: var(--danger);
            font-weight: 700;
            font-size: 0.85rem;
            margin-bottom: 24px;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--danger);
            animation: pulse 1.6s ease-in-out infinite;
        }

        .status.online {
            background: rgba(34, 197, 94, 0.12);
            color: var(--success);
        }

        .status.online .dot {
            background: var(--success);
            animation: none;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.35;
                transform: scale(0.85);
            }
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 26px;
        }

        .btn {
            display: inline-block;
            padding: 13px 24px;
            border-radius: 999px;
            background: var(--accent);
            color: #fff;
            font-weight: 800;
            text-decoration: none;
            box-shadow: 0 6px 0 var(--accent-shadow);
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.95rem;
            letter-spacing: 0.03em;
            transition: filter 0.15s ease, transform 0.1s ease, box-shadow 0.1s ease;
        }

        .btn:hover {
            filter: brightness(1.03);
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 4px 0 var(--accent-shadow);
        }

        .btn.secondary {
            background: transparent;
            color: var(--accent-dark);
            box-shadow: none;
            border: 2px solid var(--accent);
        }

        .btn.secondary:hover {
            background: rgba(236, 150, 199, 0.1);
        }

        .btn.secondary:active {
            transform: translateY(1px);
            box-shadow: none;
        }

        .tip {
            padding: 14px 16px;
            border-radius: 14px;
            background: rgba(236, 150, 199, 0.08);
            color: var(--muted);
            font-size: 0.85rem;
            line-height: 1.5;
            text-align: left;
        }

        body.dark-mode .tip {
            background: rgba(236, 150, 199, 0.12);
        }

        .tip strong {
            color: var(--text);
            display: block;
            margin-bottom: 4px;
            font-weight: 800;
        }

        .tip a {
            color: var(--accent-dark);
            text-decoration: none;
            font-weight: 700;
        }

        .tip a:hover {
            text-decoration: underline;
        }

        .retry-hint {
            font-size: 0.78rem;
            color: var(--muted);
            margin-top: 12px;
            min-height: 1em;
            transition: opacity 0.3s ease;
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .btn.loading {
            pointer-events: none;
            opacity: 0.85;
        }

        @media (max-width: 500px) {
            body {
                padding: 14px;
            }

            .card {
                padding: 28px 20px;
                border-radius: 18px;
            }

            .owl {
                font-size: 3.5rem;
            }

            h1 {
                font-size: 1.25rem;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
    <script>
        // Apply theme as early as possible to avoid a flash of light mode.
        // We inject the class on <html> and let CSS take over.
        (function applyEarlyTheme() {
            try {
                const settings = JSON.parse(localStorage.getItem('MusalingoSettings') || '{}');
                const dark = settings.theme === 'dark';
                if (dark) {
                    document.documentElement.classList.add('dark-mode');
                }
                // Match the manifest theme color for a seamless feel
                const meta = document.createElement('meta');
                meta.name = 'theme-color';
                meta.content = dark ? '#111827' : '#EC96C7';
                document.head.appendChild(meta);
            } catch (e) { /* ignore */ }
        })();
    </script>
</head>

<body>
    <div class="card">
        <div class="owl" aria-hidden="true">😺</div>

        <h1>You're offline</h1>
        <p>Musalingo needs a connection to load this page. Your saved progress is safe.</p>

        <div class="status" id="status" aria-live="polite">
            <span class="dot" aria-hidden="true"></span>
            <span id="statusText">No internet connection</span>
        </div>

        <div class="actions">
            <button class="btn" id="retryBtn" type="button">
                <span id="retryLabel">Try again</span>
            </button>
            <a class="btn secondary" href="/dashboard.html">Go to dashboard</a>
        </div>

        <div class="tip">
            <strong>💡 While you wait</strong>
            Pages you've already visited — the dashboard, courses, and past lessons — still work offline. Try one of
            those.
        </div>

        <div class="retry-hint" id="retryHint" role="status"></div>
    </div>

    <script>
        // ---------- THEME ----------
        // Sync body class with <html> class (set by the early script in <head>)
        if (document.documentElement.classList.contains('dark-mode')) {
            document.body.classList.add('dark-mode');
        }

        // Watch for changes to the saved theme (e.g. another tab changed it)
        window.addEventListener('storage', (e) => {
            if (e.key === 'MusalingoSettings') {
                try {
                    const settings = JSON.parse(e.newValue || '{}');
                    const dark = settings.theme === 'dark';
                    document.documentElement.classList.toggle('dark-mode', dark);
                    document.body.classList.toggle('dark-mode', dark);
                } catch (err) { /* ignore */ }
            }
        });

        // ---------- ONLINE / OFFLINE STATUS ----------
        const statusEl = document.getElementById('status');
        const statusText = document.getElementById('statusText');
        const retryBtn = document.getElementById('retryBtn');
        const retryLabel = document.getElementById('retryLabel');
        const retryHint = document.getElementById('retryHint');

        let retryTimer = null;

        function updateStatus() {
            const online = navigator.onLine;
            if (online) {
                statusEl.classList.add('online');
                statusText.textContent = 'Back online — reconnecting…';
            } else {
                statusEl.classList.remove('online');
                statusText.textContent = 'No internet connection';
            }
            return online;
        }

        function triggerRetry(countdown = 3) {
            // Show spinner and countdown
            retryBtn.classList.add('loading');
            retryLabel.innerHTML = '<span class="spinner"></span>Reconnecting…';
            let remaining = countdown;
            retryHint.textContent = `Retrying in ${remaining}s…`;

            clearInterval(retryTimer);
            retryTimer = setInterval(() => {
                remaining -= 1;
                if (remaining <= 0) {
                    clearInterval(retryTimer);
                    retryHint.textContent = 'Reloading…';
                    window.location.reload();
                    return;
                }
                retryHint.textContent = `Retrying in ${remaining}s…`;
            }, 1000);
        }

        retryBtn.addEventListener('click', () => {
            if (navigator.onLine) {
                triggerRetry(1);
            } else {
                retryHint.textContent = 'Still offline — check your connection.';
                // Shake the status pill to give feedback
                statusEl.style.transition = 'transform 0.1s';
                let shakes = 0;
                const shake = setInterval(() => {
                    statusEl.style.transform = shakes % 2 === 0 ? 'translateX(-3px)' : 'translateX(3px)';
                    shakes++;
                    if (shakes > 5) {
                        clearInterval(shake);
                        statusEl.style.transform = '';
                    }
                }, 60);
            }
        });

        // Auto-retry when the browser reports we're back online
        window.addEventListener('online', () => {
            updateStatus();
            triggerRetry(2);
        });

        // Update immediately when the network drops
        window.addEventListener('offline', () => {
            updateStatus();
            retryHint.textContent = '';
            clearInterval(retryTimer);
            retryBtn.classList.remove('loading');
            retryLabel.textContent = 'Try again';
        });

        // ---------- KEYBOARD SHORTCUT ----------
        // Press R or Enter to retry
        document.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') {
                if (document.activeElement === document.body) {
                    retryBtn.click();
                }
            }
        });

        // ---------- INITIAL STATE ----------
        const isOnline = updateStatus();
        if (isOnline) {
            // If we somehow loaded offline.html but are actually online,
            // bounce the user back to the dashboard automatically.
            triggerRetry(1);
        }

        // Focus the retry button on load for keyboard users
        retryBtn.focus({ preventScroll: true });
    </script>
</body>

</html>
