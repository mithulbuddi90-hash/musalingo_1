<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guidebook - Musalingo</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#EC96C7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Musalingo">
    <meta name="description" content="Musalingo — free, open source language learning. Cheaper than chai.">
    <style>
        :root {
            --bg: #131f24;
            --card: #1c2a30;
            --text: #f1f7fb;
            --muted: #8a9aa6;
            --accent: #EC96C7;
            --accent-dark: #C46AA1;
            --blue: #1cb0f6;
            --border: #2f3e46;
            --bubble: #2b3a42;
        }

        body.light-mode {
            --bg: #f7f8fc;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
            --bubble: #eef2f7;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 24px 16px 60px;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .wrap {
            max-width: 720px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            font-weight: 700;
            text-decoration: none;
            padding: 8px 0;
            margin-bottom: 14px;
            font-size: 1.05rem;
        }

        .back-link:hover {
            color: var(--text);
        }

        /* ===== HERO ===== */
        .hero {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 16px 8px 24px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .hero-art {
            font-size: 4.2rem;
            line-height: 1;
            user-select: none;
        }

        .hero-text h1 {
            margin: 0 0 6px;
            font-size: 1.45rem;
            font-weight: 800;
        }

        .hero-text p {
            margin: 0;
            color: var(--muted);
            font-weight: 600;
            font-size: 0.95rem;
        }

        /* ===== SECTION LABEL ===== */
        .section-label {
            color: var(--accent);
            font-weight: 800;
            font-size: 0.82rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        /* ===== PHRASE LIST ===== */
        .phrase-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .phrase {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 18px;
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 16px;
            cursor: pointer;
            transition: border-color 0.15s ease, transform 0.1s ease;
        }

        .phrase:hover {
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        .speaker-btn {
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--bubble);
            border: none;
            color: var(--accent);
            font-size: 1.4rem;
            cursor: pointer;
            display: grid;
            place-items: center;
        }

        .speaker-btn:hover {
            background: color-mix(in srgb, var(--accent) 15%, var(--bubble));
        }

        .speaker-btn:active {
            transform: scale(0.94);
        }

        .phrase-text {
            flex: 1;
            min-width: 0;
        }

        .phrase-jp {
            font-size: 1.15rem;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .phrase-en {
            color: var(--muted);
            font-weight: 600;
            font-size: 0.9rem;
        }

        /* ===== TIP BLOCK ===== */
        .tip-block {
            margin-top: 28px;
            padding: 16px 18px;
            background: var(--card);
            border-left: 4px solid var(--accent);
            border-radius: 12px;
            color: var(--muted);
            font-weight: 600;
            font-size: 0.92rem;
            line-height: 1.5;
        }

        .tip-block strong {
            color: var(--text);
        }

        @media (max-width: 620px) {
            .hero-art {
                font-size: 3.2rem;
            }

            .hero-text h1 {
                font-size: 1.2rem;
            }

            .phrase-jp {
                font-size: 1.05rem;
            }
        }
    </style>
</head>

        // ---------- 1. SETTINGS ----------
        const settings = JSON.parse(localStorage.getItem('MusalingoSettings') || '{}');

        if (settings.theme === 'light') {
            document.body.classList.add('light-mode');
        }

        if (settings.accent) {
            document.documentElement.style.setProperty('--accent', settings.accent);
            document.documentElement.style.setProperty('--accent-dark', darken(settings.accent, 0.2));
        }

        function darken(hex, amount) {
            const c = hex.replace('#', '');
            const r = parseInt(c.slice(0, 2), 16);
            const g = parseInt(c.slice(2, 4), 16);
            const b = parseInt(c.slice(4, 6), 16);
            const adj = v => Math.max(0, Math.min(255, Math.round(v * (1 - amount))));
            return '#' +
                adj(r).toString(16).padStart(2, '0') +
                adj(g).toString(16).padStart(2, '0') +
                adj(b).toString(16).padStart(2, '0');
        }

                },
                3: {
                    title: 'Unit 3 Guidebook',
                    intro: 'Completing the scale',
                    art: '🎼',
                    phrases: [
                        { jp: 'Ti', en: 'Seventh note' },
                        { jp: 'Do (high)', en: 'Octave — start of the next scale' }
                    ],
                    tip: '<strong>Tip:</strong> Ti creates tension that resolves to Do.'
                }
            }
        };

        function defaultGuide() {
            return {
                title: `Unit ${sectionNo} Guidebook`,
                intro: 'Explore grammar tips and key phrases for this unit',
                art: '🧑‍🎨',
                phrases: [],
                tip: ''
            };
        }

        const courseGuides = GUIDES[courseId] || {};
        const guide = courseGuides[sectionNo] || defaultGuide();

        // ---------- 4. RENDER ----------
        document.getElementById('guideTitle').textContent = guide.title;
        document.getElementById('guideIntro').textContent = guide.intro;
        document.getElementById('heroArt').textContent = guide.art || '🧑‍🎨';

        document.getElementById('backLink').href =
            `sections.html?courseId=${encodeURIComponent(courseId)}`;

        const list = document.getElementById('phraseList');
        if (!guide.phrases.length) {
            list.innerHTML = `<p style="color:var(--muted);">No phrases for this unit yet.</p>`;
        } else {
            list.innerHTML = guide.phrases.map((p, i) => `
                <div class="phrase" data-idx="${i}">
                    <button class="speaker-btn" data-idx="${i}" aria-label="Play audio">🔊</button>
                    <div class="phrase-text">
                        <div class="phrase-jp">${p.jp}</div>
                        <div class="phrase-en">${p.en}</div>
                    </div>
                </div>
            `).join('');
        }

        if (guide.tip) {
            const tipBlock = document.getElementById('tipBlock');
            tipBlock.innerHTML = guide.tip;
            tipBlock.hidden = false;
        }

        // ---------- 5. TTS via sounds.js ----------
        // Map course ids to display names for SFX.pronounce.
        const COURSE_ID_TO_LANG = {
            japanese: 'Japanese',
            spanish: 'Spanish',
            french: 'French',
            german: 'German',
            italian: 'Italian',
            hindi: 'Hindi',
            arabic: 'Arabic',
            english: 'English',
            korean: 'Korean',
            telugu: 'Telugu',
            chinese: 'Chinese',
            portuguese: 'Portuguese',
            russian: 'Russian',
            turkish: 'Turkish',
            chess: 'English',
            math: 'English',
            music: 'English'
        };

        document.getElementById('phraseList').addEventListener('click', (e) => {
            const btn = e.target.closest('.speaker-btn');
            const row = e.target.closest('.phrase');
            if (!btn && !row) return;

            const idx = Number((btn || row).dataset.idx);
            const phrase = guide.phrases[idx];
            if (!phrase) return;

            const spokenLang = COURSE_ID_TO_LANG[courseId] || 'English';
            SFX.pronounce(phrase.jp, { lang: spokenLang, rate: 0.85 });
        });
    </script>

    <script src="theme.js"></script>
    <script src="bloat.js"></script>
    <script src="pwa.js" defer></script>
</body>

</html>
