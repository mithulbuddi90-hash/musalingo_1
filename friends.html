<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Friends - Musalingo</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#EC96C7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Musalingo">
    <meta name="description" content="Musalingo — free, open source language learning. Cheaper than chai.">
    <style>
        :root {
            --bg: #f7f8fc;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --accent: #EC96C7;
            --accent-dark: #F490C3;
            --border: #f1d5e5;
            --soft-pink: #fff1f8;
            --danger: #e11d48;
            --success: #16a34a;
            --blue: #2b70c9;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #fdf2f8 0%, #f8fbff 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 24px;
        }

        .page {
            max-width: 820px;
            margin: 0 auto;
        }

        .shell {
            background: var(--card);
            border-radius: 24px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            padding: 28px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            color: #fff;
        }

        .hero h1 {
            margin: 0;
            font-size: clamp(1.8rem, 3vw, 2.4rem);
        }

        .hero p {
            margin: 8px 0 0;
            opacity: 0.9;
            font-weight: 600;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.18);
            color: #fff;
            text-decoration: none;
            font-weight: 800;
            border: 1px solid rgba(255, 255, 255, 0.35);
            cursor: pointer;
            font: inherit;
        }

        .content {
            padding: 24px 28px 30px;
        }

        .panel {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 20px;
        }

        .panel h2 {
            margin: 0 0 14px;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .panel h2 .badge {
            background: var(--accent);
            color: #fff;
            font-size: 0.75rem;
            font-weight: 900;
            padding: 2px 10px;
            border-radius: 999px;
            letter-spacing: 0.04em;
        }

        .message {
            margin-top: 12px;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--muted);
            min-height: 1.2em;
        }

        .message.error {
            color: var(--danger);
        }

        .message.success {
            color: var(--success);
        }

        form.add-form {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        input[type="email"] {
            flex: 1 1 220px;
            min-width: 0;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid #e7d1e0;
            font: inherit;
            background: #fff8fc;
            color: var(--text);
        }

        button[type="submit"] {
            padding: 12px 18px;
            border: none;
            border-radius: 12px;
            background: var(--accent);
            color: white;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--accent-dark);
        }

        button[type="submit"]:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            box-shadow: none;
        }

        .friend-list {
            display: grid;
            gap: 12px;
        }

        .friend-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: #fff;
        }

        .friend-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-weight: 900;
            background: linear-gradient(135deg, #fde7f3, #f9d7ef);
            color: var(--accent-dark);
            flex-shrink: 0;
        }

        .friend-name {
            font-weight: 800;
        }

        .friend-streak {
            color: var(--accent-dark);
            font-size: 0.9rem;
            font-weight: 800;
        }

        .row-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .btn-mini {
            padding: 8px 14px;
            border-radius: 10px;
            border: none;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            font: inherit;
        }

        .btn-accept {
            background: var(--success);
            color: white;
        }

        .btn-decline {
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        .btn-play {
            background: var(--blue);
            color: white;
        }

        .btn-remove {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border);
        }

        .empty-state {
            padding: 22px;
            border: 1px dashed #e5b8d3;
            border-radius: 16px;
            background: var(--soft-pink);
            color: #6d2d57;
            font-weight: 700;
        }

        .empty-state a {
            color: var(--accent-dark);
        }

        .signin-notice {
            padding: 16px;
            border-radius: 14px;
            background: #fff7ed;
            border: 1px solid #fed7aa;
            color: #7c2d12;
            font-weight: 700;
            margin-bottom: 16px;
        }

        @media (max-width: 700px) {
            body {
                padding: 14px;
            }

            .hero {
                flex-direction: column;
                align-items: flex-start;
                padding: 22px 18px 18px;
            }

            .content {
                padding: 18px 16px 22px;
            }

            .actions,
            .btn {
                width: 100%;
                text-align: center;
            }

            .friend-row {
                flex-direction: column;
                align-items: flex-start;
            }

            .row-actions {
                width: 100%;
            }

            .btn-mini {
                flex: 1;
                text-align: center;
            }

            form.add-form {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <section class="shell">
            <header class="hero">
                <div>
                    <h1>Friends</h1>
                    <p>Compare streaks, play chess, celebrate progress.</p>
                </div>
                <div class="actions">
                    <a class="btn" href="dashboard.html">Dashboard</a>
                    <a class="btn" href="matches.html">Play chess</a>
                </div>
            </header>

            <div class="content">
                <div id="signinNotice" class="signin-notice" style="display:none;">
                    You're browsing as a guest. Sign in to add friends and play chess together.
                    <a href="signin.html">Sign in →</a>
                </div>

                <section class="panel">
                    <h2>Connect with a friend</h2>
                    <form id="friendForm" class="add-form" autocomplete="off">
                        <input id="friendEmail" type="email" placeholder="Friend's email" required />
                        <button type="submit" id="addFriendBtn">Send friend request</button>
                    </form>
                    <div id="friendMessage" class="message" aria-live="polite"></div>
                </section>

                <section class="panel" id="incomingPanel" style="display:none;">
                    <h2>Incoming requests <span class="badge" id="incomingCount">0</span></h2>
                    <div class="friend-list" id="incomingList"></div>
                </section>

                <section class="panel" id="outgoingPanel" style="display:none;">
                    <h2>Sent requests</h2>
                    <div class="friend-list" id="outgoingList"></div>
                </section>

                <section class="panel">
                    <h2>Your friends</h2>
                    <div class="friend-list" id="friendsList"></div>
                </section>
            </div>
        </section>
    </main>

    <script src="sounds.js"></script>

    <script type="module">
        import {
            isGuestMode,
            loadLocalProfile,
            saveLocalProfile,
            sendFriendRequest,
            acceptFriendRequest,
            declineFriendRequest,
            removeFriend,
            loadFriendsProfiles,
            listenToIncomingRequests,
            listenToOutgoingRequests,
            listenToUserDocument
        } from './firebase.js';

        const profile = loadLocalProfile();
        const myUid = profile.uid || '';
        const isGuest = isGuestMode() || !myUid;

        const friendForm = document.getElementById('friendForm');
        const emailInput = document.getElementById('friendEmail');
        const addBtn = document.getElementById('addFriendBtn');
        const messageEl = document.getElementById('friendMessage');
        const signinNotice = document.getElementById('signinNotice');
        const incomingPanel = document.getElementById('incomingPanel');
        const outgoingPanel = document.getElementById('outgoingPanel');
        const incomingList = document.getElementById('incomingList');
        const outgoingList = document.getElementById('outgoingList');
        const incomingCount = document.getElementById('incomingCount');
        const friendsList = document.getElementById('friendsList');

        let unsubIn = null, unsubOut = null, unsubMe = null;

        function showMessage(text, type = '') {
            messageEl.textContent = text;
            messageEl.className = 'message' + (type ? ' ' + type : '');
        }

        function initials(name, email) {
            const base = (name || email || 'F').trim();
            return base.slice(0, 2).toUpperCase();
        }

        function escapeHtml(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
            }[c]));
        }

        if (isGuest) {
            signinNotice.style.display = 'block';
            addBtn.disabled = true;
            emailInput.disabled = true;
            addBtn.textContent = 'Sign in to add friends';
        }

        /* ---------- FRIEND LIST ---------- */
        async function renderFriends() {
            if (isGuest) {
                friendsList.innerHTML = '<div class="empty-state">Sign in to see your friends.</div>';
                return;
            }
            friendsList.innerHTML = '<div class="empty-state">Loading…</div>';
            try {
                const friends = await loadFriendsProfiles(myUid);
                if (!friends.length) {
                    friendsList.innerHTML = '<div class="empty-state">No friends yet. Send a request above!</div>';
                    return;
                }
                friendsList.innerHTML = friends.map(f => `
                    <div class="friend-row">
                        <div class="friend-meta">
                            <div class="avatar">${initials(f.name, f.email)}</div>
                            <div>
                                <div class="friend-name">${escapeHtml(f.name || f.email)}</div>
                                <div class="friend-streak">🔥 ${Number(f.streak) || 0} day streak</div>
                            </div>
                        </div>
                        <div class="row-actions">
                            <button class="btn-mini btn-play" data-action="play" data-uid="${escapeHtml(f.uid)}">Play chess</button>
                            <button class="btn-mini btn-remove" data-action="remove" data-uid="${escapeHtml(f.uid)}">Remove</button>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                friendsList.innerHTML = '<div class="empty-state">Could not load friends.</div>';
            }
        }

        /* ---------- INCOMING / OUTGOING ---------- */
        function renderIncoming(items) {
            if (!items.length) {
                incomingPanel.style.display = 'none';
                return;
            }
            incomingPanel.style.display = 'block';
            incomingCount.textContent = items.length;
            incomingList.innerHTML = items.map(req => `
                <div class="friend-row">
                    <div class="friend-meta">
                        <div class="avatar">${initials(req.fromName, req.fromEmail)}</div>
                        <div>
                            <div class="friend-name">${escapeHtml(req.fromName || req.fromEmail)}</div>
                            <div class="friend-streak">wants to be friends</div>
                        </div>
                    </div>
                    <div class="row-actions">
                        <button class="btn-mini btn-accept" data-action="accept" data-req="${req.id}" data-uid="${req.fromUid}">Accept</button>
                        <button class="btn-mini btn-decline" data-action="decline" data-req="${req.id}">Decline</button>
                    </div>
                </div>
            `).join('');
        }

        function renderOutgoing(items) {
            if (!items.length) {
                outgoingPanel.style.display = 'none';
                return;
            }
            outgoingPanel.style.display = 'block';
            outgoingList.innerHTML = items.map(req => `
                <div class="friend-row">
                    <div class="friend-meta">
                        <div class="avatar">${initials(req.toEmail, req.toEmail)}</div>
                        <div>
                            <div class="friend-name">${escapeHtml(req.toEmail)}</div>
                            <div class="friend-streak">Request pending…</div>
                        </div>
                    </div>
                    <div class="row-actions">
                        <button class="btn-mini btn-remove" data-action="cancel" data-req="${req.id}">Cancel</button>
                    </div>
                </div>
            `).join('');
        }

        /* ---------- FRIEND REQUEST FORM ---------- */
        friendForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (isGuest) return;
            const email = emailInput.value.trim();
            if (!email) return;
            addBtn.disabled = true;
            showMessage('Sending…');
            try {
                const res = await sendFriendRequest({
                    fromUid: myUid,
                    fromEmail: profile.email,
                    fromName: profile.name,
                    toEmail: email
                });
                if (res.status === 'sent') {
                    showMessage(`Request sent to ${res.targetName || email}.`, 'success');
                    SFX.correct();
                    emailInput.value = '';
                } else if (res.status === 'auto_accepted') {
                    showMessage(`You and ${email} are now friends!`, 'success');
                    SFX.correct();
                    emailInput.value = '';
                    renderFriends();
                } else if (res.status === 'already_friends') {
                    showMessage('You are already friends.', 'error');
                    SFX.error();
                } else if (res.status === 'already_pending') {
                    showMessage('A request is already pending.', 'error');
                    SFX.error();
                } else {
                    showMessage(res.message || 'Could not send request.', 'error');
                    SFX.error();
                }
            } catch (err) {
                showMessage(err.message || 'Network error.', 'error');
                SFX.error();
            } finally {
                addBtn.disabled = false;
            }
        });

        /* ---------- FRIEND LIST ACTIONS ---------- */
        friendsList.addEventListener('click', async (e) => {
            const btn = e.target.closest('button[data-action]');
            if (!btn) return;
            const action = btn.dataset.action;
            if (action === 'play') {
                SFX.click();
                window.location.href = `matches.html?challenge=${encodeURIComponent(btn.dataset.uid)}`;
            } else if (action === 'remove') {
                if (!confirm('Remove this friend?')) return;
                await removeFriend(myUid, btn.dataset.uid);
                renderFriends();
                SFX.click();
            }
        });

        /* ---------- INCOMING ACTIONS ---------- */
        incomingList.addEventListener('click', async (e) => {
            const btn = e.target.closest('button[data-action]');
            if (!btn) return;
            const action = btn.dataset.action;
            if (action === 'accept') {
                await acceptFriendRequest(btn.dataset.req, myUid, btn.dataset.uid);
                renderFriends();
                SFX.correct();
            } else if (action === 'decline') {
                await declineFriendRequest(btn.dataset.req);
                SFX.wrong();
            }
        });

        /* ---------- OUTGOING ACTIONS ---------- */
        outgoingList.addEventListener('click', async (e) => {
            const btn = e.target.closest('button[data-action="cancel"]');
            if (!btn) return;
            await declineFriendRequest(btn.dataset.req);
            SFX.click();
        });

        /* ---------- LIVE LISTENERS ---------- */
        if (!isGuest) {
            unsubIn = listenToIncomingRequests(myUid, renderIncoming);
            unsubOut = listenToOutgoingRequests(myUid, renderOutgoing);
            unsubMe = listenToUserDocument(myUid, (doc) => {
                if (doc) {
                    const local = loadLocalProfile();
                    const next = { ...local, friends: doc.friends || [] };
                    saveLocalProfile(next);
                }
            });
        }

        renderFriends();

        // Refresh friend streaks whenever the tab regains focus
        window.addEventListener('focus', () => { if (!isGuest) renderFriends(); });

        // Cleanup listeners on navigation
        window.addEventListener('pagehide', () => {
            try { unsubIn && unsubIn(); } catch { }
            try { unsubOut && unsubOut(); } catch { }
            try { unsubMe && unsubMe(); } catch { }
        });
    </script>

    <script src="theme.js"></script>
    <script src="bloat.js"></script>
    <script src="pwa.js" defer></script>
</body>

</html>
